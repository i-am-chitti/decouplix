name: Build & Bundle Plugin Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm Dependencies
        run: npm ci

      - name: Compile Production Assets
        run: npm run build

      - name: Create Production Bundle Directory
        run: |
          mkdir -p dist/decouplix
          cp -r build includes languages decouplix.php readme.txt LICENSE dist/decouplix/

      - name: Zip Plugin Package
        run: |
          cd dist
          zip -r ../decouplix.zip decouplix/

      - name: Upload Build Artifact to Run
        uses: actions/upload-artifact@v4
        with:
          name: decouplix
          path: dist/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Zip to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: decouplix.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        if: github.event_name == 'release'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          BUILD_DIR: dist/decouplix
