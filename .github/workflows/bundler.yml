name: Build & Bundle Plugin Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install npm Dependencies
        run: npm ci

      - name: Compile Production Assets
        run: npm run build

      - name: Create Production Bundle Directory
        run: |
          mkdir -p dist/headless-companion
          cp -r build includes headless-companion.php readme.txt dist/headless-companion/

      - name: Zip Plugin Package
        run: |
          cd dist
          zip -r ../headless-companion.zip headless-companion/

      - name: Upload Build Artifact to Run
        uses: actions/upload-artifact@v4
        with:
          name: headless-companion
          path: dist/
          if-no-files-found: error

      - name: Upload Zip to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: headless-companion.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
